# The datasource is supplied by the Testcontainers PostgreSQL instance
# through @ServiceConnection, so no URL is configured here.

# Flyway builds the schema, exactly as it does in production...
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ...and Hibernate verifies that the entities still match it. A mismatch
# between an entity and a migration fails the build instead of showing up
# the first time the application is started.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
